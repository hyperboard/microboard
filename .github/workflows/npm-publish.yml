name: NPM Publish

on:
  push:
    branches:
      - trunk

permissions:
  id-token: write  # This is required for OIDC authentication
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-bump.outputs.newTag }}
      package_name: ${{ steps.package-metadata.outputs.package_name }}
      published_at: ${{ steps.publish-metadata.outputs.published_at }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.5

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: bun run build

      - name: Run tests
        run: bun test

      - name: Lint
        continue-on-error: true # Temporary: keep publish flow moving even if lint reports issues
        run: bun run lint

      - name: Automated Version Bump
        id: version-bump
        uses: phips28/gh-action-bump-version@master
        with:
          skip-tag: "true"
          minor-wording: "feat,feature"
          major-wording: "MAJOR,BREAKING CHANGE"
          patch-wording: "fix,refactor,add"
          rc-wording: "RELEASE,alpha"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture package metadata
        id: package-metadata
        run: echo "package_name=$(node -p 'require("./package.json").name' | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to NPM
        run: |
          npm install -g npm@latest
          npm publish --provenance

      - name: Capture publish metadata
        id: publish-metadata
        run: echo "published_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  notify-ui:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Notify UI repository about published version
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.UI_REPOSITORY_DISPATCH_TOKEN }}
          script: |
            const [owner, repo] = "${{ vars.UI_REPOSITORY }}".split("/");

            if (!owner || !repo) {
              core.setFailed("Repository variable UI_REPOSITORY must be set as owner/repo.");
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: "microboard_published",
              client_payload: {
                package_name: "${{ needs.publish.outputs.package_name }}",
                version: "${{ needs.publish.outputs.version }}",
                source_repository: "${{ github.repository }}",
                source_ref: "${{ github.ref_name }}",
                source_sha: "${{ github.sha }}",
                workflow: "${{ github.workflow }}",
                published_at: "${{ needs.publish.outputs.published_at }}"
              }
            });

  notify-backend:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Notify backend repository about published version
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BACKEND_REPOSITORY_DISPATCH_TOKEN }}
          script: |
            const [owner, repo] = "${{ vars.BACKEND_REPOSITORY }}".split("/");

            if (!owner || !repo) {
              core.setFailed("Repository variable BACKEND_REPOSITORY must be set as owner/repo.");
              return;
            }

            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: "microboard_published",
              client_payload: {
                package_name: "${{ needs.publish.outputs.package_name }}",
                version: "${{ needs.publish.outputs.version }}",
                source_repository: "${{ github.repository }}",
                source_ref: "${{ github.ref_name }}",
                source_sha: "${{ github.sha }}",
                workflow: "${{ github.workflow }}",
                published_at: "${{ needs.publish.outputs.published_at }}"
              }
            });
